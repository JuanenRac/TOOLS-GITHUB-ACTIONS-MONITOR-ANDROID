name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push to a branch replaces the run before it; the runs of main and of the tags are never cancelled
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # The checks every repository of the suite runs, held once in EH3D-DOCS as a reusable workflow
  # (the manifest, the documents, the pictures of the README, the tests of tools/). The reference is
  # a full commit, so a change there reaches this repository only when this line is moved.
  validate:
    uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@4610941ddec34b44f54073f0f0acf1ccd1b9ae48
    with:
      python-version: "3.12"
      check-pictures: true
      run-tool-tests: true

  changelog:
    name: The change has a line in the CHANGELOG
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compare with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -I tools/changelog_pr_check.py --base "origin/$BASE_REF"

  # The Android build: the unit tests (they run on the JVM, no phone) and lint. No APK is built here. Gradle runs here and nowhere else.
  android:
    name: Gradle JVM tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The light checks of the app (languages, resources, config, secrets)
        run: python -I tools/check_app.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: The number of tests that ran is the one the README states
        run: python -I tools/check_app.py --junit app/build/test-results/testDebugUnitTest 64
      - name: Keep the reports of the tests and of lint
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # The client against the monitor itself: demo monitors (invented data) are started from the monitor commit pinned below, the recorded answers the tests use are
  # checked against what they answer now, and the client with its real network code talks to them.
  contract:
    name: The client against demo monitors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/TOOLS-GITHUB-ACTIONS-MONITOR
          ref: 3d47eabe43bd51592ea84bcfcc0b47b376e499b3 # the monitor the app is checked against (2.2.0)
          path: monitor-checkout
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Start the demo monitors
        run: bash tools/contract/start.sh "$GITHUB_WORKSPACE/monitor-checkout" "$RUNNER_TEMP/monitor-logs"
      - name: The recorded answers still have the shape the monitor gives
        run: python3 tools/contract/record.py --check app/src/test/resources/contract --host 127.0.0.1
      - name: The client against the running monitors
        env:
          LIVE_MONITOR: "1"
        run: ./gradlew testDebugUnitTest --tests '*LiveMonitorTest' --no-daemon
      - name: None of those tests was skipped
        run: |
          grep -h '<testsuite ' app/build/test-results/testDebugUnitTest/*LiveMonitorTest.xml | tee suite.txt
          grep -q 'tests="5" skipped="0" failures="0" errors="0"' suite.txt
      - name: Logs of the monitors
        if: ${{ failure() }}
        run: tail -n 80 "$RUNNER_TEMP"/monitor-logs/*.log

  # The one check to require in the rules of the branch. It always runs, fails when a job failed or was cancelled and accepts a job that was
  # skipped on purpose (the changelog check on a push, an expensive job whose paths did not change), so it never waits for a job that did not start.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [validate, changelog, android, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job ran, or was skipped on purpose
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
