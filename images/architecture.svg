<title id="t">TOOLS-GITHUB-ACTIONS-MONITOR-ANDROID architecture</title>
<desc id="d">The Android app reads a GitHub Actions Monitor in network mode with its access token and, in team mode, the session of a person, both sealed by the Android Keystore; it shows the summary, alerts, repositories and the proposals of its AI read only, and opens ghamon links. It sends no push notifications.</desc>
